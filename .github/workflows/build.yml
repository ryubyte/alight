name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Test
        run: make test

  release:
    name: Build & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build arm64
        run: go build -ldflags="-s -w" -o aglight-darwin-arm64 .
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"

      - name: Build amd64
        run: CGO_ENABLED=1 GOARCH=amd64 go build -ldflags="-s -w" -o aglight-darwin-amd64 .
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aglight-darwin-arm64
            aglight-darwin-amd64
